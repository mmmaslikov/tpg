<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ТПГ «ГенИИ» — Паспорт и обоснование</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --surface-3: #e4e4e7;
    --fg: #09090b;
    --fg-2: #27272a;
    --muted: #71717a;
    --muted-2: #a1a1aa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --accent-2: #1d4ed8;
    --success: #059669;
    --success-soft: #d1fae5;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --violet: #7c3aed;
    --violet-soft: #ede9fe;
    --rose: #e11d48;
    --rose-soft: #ffe4e6;
    --amber: #d97706;
    --amber-soft: #fef3c7;
    --teal: #0d9488;
    --teal-soft: #ccfbf1;
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow: 0 4px 14px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 20px 40px -12px rgba(15, 23, 42, 0.12);
    --font: system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --container: 1120px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--fg);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  ::selection { background: var(--accent-soft); color: var(--accent-2); }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .progress-bar {
    position: fixed; top: 0; left: 0; height: 2px; width: 0%;
    background: var(--accent); z-index: 100; transition: width 0.1s linear;
  }

  .nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(250, 250, 250, 0.8);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: var(--container); margin: 0 auto;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 14px; letter-spacing: -0.01em;
    color: var(--fg);
  }
  .nav-logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    display: grid; place-items: center;
    color: white; font-weight: 700; font-size: 12px;
    box-shadow: var(--shadow-sm);
  }
  .nav-links {
    display: flex; gap: 4px; margin-left: auto;
    overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-link {
    padding: 8px 12px; border-radius: 8px;
    font-size: 13px; color: var(--muted);
    white-space: nowrap; transition: all 0.15s;
    font-weight: 500;
  }
  .nav-link:hover { color: var(--fg); background: var(--surface-2); text-decoration: none; }
  .nav-link.active { color: var(--accent-2); background: var(--accent-soft); }
  .nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .container { max-width: var(--container); margin: 0 auto; padding: 0 20px; }
  section { padding: 72px 0; scroll-margin-top: 72px; }
  section + section { border-top: 1px solid var(--border); }

  .hero { padding: 80px 0 40px; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 12px; color: var(--muted); font-weight: 500;
    margin-bottom: 20px;
  }
  .hero-eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success); box-shadow: 0 0 0 3px var(--success-soft);
  }
  .hero h1 {
    font-size: clamp(36px, 6vw, 56px);
    line-height: 1.05; letter-spacing: -0.03em;
    font-weight: 700; margin: 0 0 16px;
    color: var(--fg);
  }
  .hero h1 .accent {
    background: linear-gradient(135deg, var(--accent), #6366f1);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero-sub {
    font-size: clamp(16px, 2vw, 19px);
    color: var(--muted); max-width: 720px;
    line-height: 1.5; margin: 0 0 32px;
  }

  .passport-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px; margin-top: 32px;
  }
  .passport-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
    transition: all 0.2s;
  }
  .passport-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .passport-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600; margin-bottom: 6px;
  }
  .passport-value { font-size: 15px; font-weight: 500; color: var(--fg-2); }

  .section-head { margin-bottom: 40px; }
  .section-num {
    display: inline-block;
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 10px;
  }
  .section-title {
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 700; letter-spacing: -0.02em;
    line-height: 1.15; margin: 0 0 12px;
  }
  .section-lead {
    font-size: 17px; color: var(--muted); max-width: 720px;
    line-height: 1.55; margin: 0;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px;
    transition: all 0.2s;
  }
  .card:hover { box-shadow: var(--shadow); }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

  .accordion { display: flex; flex-direction: column; gap: 10px; }
  .acc-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .acc-item.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .acc-trigger {
    width: 100%; padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
    text-align: left; font-size: 15px; font-weight: 500;
    color: var(--fg); transition: background 0.15s;
    min-height: 44px;
  }
  .acc-trigger:hover { background: var(--surface-2); }
  .acc-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .acc-icon {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: 8px; background: var(--accent-soft);
    color: var(--accent-2);
    display: grid; place-items: center;
  }
  .acc-title { flex: 1; }
  .acc-chevron {
    width: 20px; height: 20px; color: var(--muted);
    transition: transform 0.25s;
  }
  .acc-item.open .acc-chevron { transform: rotate(180deg); color: var(--accent); }
  .acc-content {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease;
  }
  .acc-item.open .acc-content { max-height: 1200px; }
  .acc-body {
    padding: 0 20px 20px 66px;
    color: var(--fg-2); font-size: 14.5px; line-height: 1.6;
  }
  .acc-body ul { margin: 8px 0 0; padding-left: 18px; }
  .acc-body li { margin-bottom: 6px; }
  .acc-body strong { color: var(--fg); font-weight: 600; }

  .formula {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: white; border-radius: var(--radius-lg);
    padding: 32px; margin: 24px 0;
    position: relative; overflow: hidden;
  }
  .formula::before {
    content: ''; position: absolute; top: -50%; right: -20%;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.25), transparent 70%);
    pointer-events: none;
  }
  .formula-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.6); font-weight: 600; margin-bottom: 14px;
    position: relative;
  }
  .formula-text {
    font-size: clamp(15px, 2.2vw, 19px); line-height: 1.6;
    position: relative; font-weight: 400;
  }
  .formula-text .hl {
    color: #93c5fd; font-weight: 600;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(59,130,246,0.15);
  }

  .criteria-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .criteria-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .criteria-row .check {
    width: 22px; height: 22px; flex-shrink: 0;
    border-radius: 50%; background: var(--success-soft);
    color: var(--success); display: grid; place-items: center;
  }
  .criteria-row .label { font-weight: 500; font-size: 14.5px; }
  .criteria-row .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .team-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .member {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    transition: all 0.2s;
  }
  .member:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 600; font-size: 13px; color: white;
    flex-shrink: 0;
  }
  .member-info { min-width: 0; flex: 1; }
  .member-name {
    font-size: 13.5px; font-weight: 500; color: var(--fg);
    line-height: 1.3;
  }
  .member-role {
    font-size: 11.5px; color: var(--muted);
    line-height: 1.4;
    margin-top: 2px;
  }

  .timeline {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; margin-top: 24px; position: relative;
  }
  .tl-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px;
    position: relative; transition: all 0.2s;
  }
  .tl-item:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .tl-item::before {
    content: ''; position: absolute; top: -8px; left: 18px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .tl-period {
    font-size: 12px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  .tl-title { font-size: 14px; font-weight: 600; color: var(--fg); }

  .risk-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
    cursor: pointer; transition: all 0.2s;
  }
  .risk-card:hover { border-color: var(--warn); }
  .risk-card.open { border-color: var(--warn); background: var(--warn-soft); }
  .risk-head {
    display: flex; align-items: flex-start; gap: 12px;
  }
  .risk-icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--warn-soft); color: var(--warn);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .risk-card.open .risk-icon { background: white; }
  .risk-title { font-weight: 600; font-size: 14.5px; flex: 1; }
  .risk-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .risk-mitigation {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--border-strong);
    font-size: 13.5px; color: var(--fg-2); line-height: 1.55;
    display: none;
  }
  .risk-card.open .risk-mitigation { display: block; }
  .risk-mitigation strong { color: var(--success); font-weight: 600; }

  .thesis-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px;
    transition: all 0.25s;
    position: relative; overflow: hidden;
  }
  .thesis-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--border-strong); }
  .thesis-num {
    font-size: 11px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .thesis-q {
    font-size: 15px; font-weight: 600; color: var(--fg);
    margin: 0 0 10px; line-height: 1.35;
  }
  .thesis-a {
    font-size: 14.5px; color: var(--fg-2); line-height: 1.55;
    margin: 0;
  }

  .metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin-top: 24px;
  }
  .metric {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .metric-label {
    font-size: 12px; color: var(--muted); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .metric-value {
    font-size: 28px; font-weight: 700; color: var(--fg);
    letter-spacing: -0.02em; line-height: 1;
  }
  .metric-unit { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .metric-hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

  /* Role cards */
  .role-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px; margin-top: 24px;
  }
  .role-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 24px;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .role-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--role-color, var(--accent));
  }
  .role-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .role-head {
    display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
  }
  .role-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--role-soft, var(--accent-soft));
    color: var(--role-color, var(--accent));
    display: grid; place-items: center; flex-shrink: 0;
  }
  .role-title {
    font-size: 16px; font-weight: 600; color: var(--fg);
    letter-spacing: -0.01em;
  }
  .role-subtitle {
    font-size: 12.5px; color: var(--muted); margin-top: 2px;
  }
  .role-list {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .role-list li {
    position: relative; padding-left: 22px;
    font-size: 14px; color: var(--fg-2); line-height: 1.5;
  }
  .role-list li::before {
    content: ''; position: absolute; left: 0; top: 8px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--role-color, var(--accent));
    opacity: 0.5;
  }
  .role-list li strong { color: var(--fg); font-weight: 600; }

  /* Personalization block */
  .personalization {
    background: linear-gradient(135deg, #f0f9ff 0%, #eef2ff 100%);
    border: 1px solid #bfdbfe;
    border-radius: var(--radius-lg); padding: 28px;
    margin-top: 24px; position: relative; overflow: hidden;
  }
  .personalization::before {
    content: ''; position: absolute; top: -50%; right: -20%;
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.08), transparent 70%);
    pointer-events: none;
  }
  .personalization-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
    position: relative;
  }
  .personalization-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--violet));
    color: white; display: grid; place-items: center;
    box-shadow: var(--shadow-sm);
  }
  .personalization-title {
    font-size: 18px; font-weight: 600; color: var(--fg);
    letter-spacing: -0.01em;
  }
  .personalization-sub {
    font-size: 13.5px; color: var(--muted); margin-top: 2px;
  }
  .personalization-def {
    font-size: 14.5px; color: var(--fg-2); line-height: 1.6;
    padding: 14px 18px; background: rgba(255,255,255,0.7);
    border-radius: var(--radius); border-left: 3px solid var(--violet);
    margin-bottom: 16px; position: relative;
  }
  .personalization-goals {
    position: relative;
  }
  .personalization-goals-title {
    font-size: 13px; font-weight: 600; color: var(--violet);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .personalization-goals ul {
    margin: 0; padding-left: 18px;
  }
  .personalization-goals li {
    font-size: 14px; color: var(--fg-2); line-height: 1.6;
    margin-bottom: 8px;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 40px 0; margin-top: 40px;
    background: var(--surface);
  }
  .footer-inner {
    display: flex; flex-wrap: wrap; gap: 16px;
    justify-content: space-between; align-items: center;
  }
  .footer-text { font-size: 13px; color: var(--muted); }

  @media (max-width: 640px) {
    section { padding: 48px 0; }
    .hero { padding: 48px 0 24px; }
    .nav-inner { padding: 12px 16px; }
    .container { padding: 0 16px; }
    .nav-brand span.brand-text { display: none; }
    .nav-link { padding: 7px 10px; font-size: 12.5px; }
    .card { padding: 18px; }
    .formula { padding: 22px; }
    .timeline { grid-template-columns: 1fr 1fr; }
    .acc-body { padding: 0 16px 16px 16px; }
    .team-grid { grid-template-columns: 1fr; }
    .role-grid { grid-template-columns: 1fr; }
    .personalization { padding: 20px; }
  }
  @media (max-width: 400px) {
    .timeline { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>

<nav class="nav" aria-label="Основная навигация">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="nav-logo">Г</div>
      <span class="brand-text">ТПГ «ГенИИ»</span>
    </div>
    <div class="nav-links" id="navLinks"></div>
  </div>
</nav>

<main id="app"></main>

<footer>
  <div class="container footer-inner">
    <div class="footer-text">ЧОУ «ОК Точка будущего» · ТПГ «ГенИИ» · 2026/2027 учебный год</div>
    <div class="footer-text">Куратор: Масликов М.М. · Заказчик: Никулин Е.Е.</div>
  </div>
</footer>

<script>
  // ====== DATA ======
  const NAV = [
    { id: 'hero', label: 'Паспорт' },
    { id: 'stage1', label: 'Проблема' },
    { id: 'stage2', label: 'Тема' },
    { id: 'stage3', label: 'Актуальность' },
    { id: 'stage4', label: 'Цели и продукт' },
    { id: 'stage5', label: 'Ресурсы' },
    { id: 'stage6', label: 'Тезисы' },
    { id: 'stage7', label: 'Применение' }
  ];

  const PASSPORT = {
    customer: 'руководитель старшей школы Никулин Е.Е.',
    curator: 'учитель информатики Масликов М.М.',
    name: '«ГенИИ»',
    fullName: 'Исследование актуальных сервисов ИИ и создание современных образовательных продуктов',
    goal: 'Создание системы эффективного использования технологий ИИ в образовательном процессе, методической работе и проектной деятельности ЧОУ «ОК Точка будущего».'
  };

  const STAGE1 = {
    problem: 'Отсутствие системного подхода к интеграции ИИ в ежедневную практику сотрудников комплекса; разрыв между высоким интересом к нейросетям и реальным их применением для создания образовательных и управленческих продуктов.',
    items: [
      {
        icon: 'alert',
        title: 'Что именно не устраивает в текущей практике?',
        body: 'Стихийное использование ИИ (только для личных нужд или эпизодически), большие временные затраты сотрудников на рутину (составление отчетов, характеристик, конспектов, презентаций, сценариев), отсутствие единых стандартов качества ИИ-контента и этики его применения.'
      },
      {

    chevron: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
    warn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    shield: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    user: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    chalkboard: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20v14H2z"/><path d="M6 20h12"/><path d="M8 8h8"/><path d="M8 12h5"/></svg>',
    brain: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/></svg>',
    sparkles: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>',
    briefcase: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
    personalize: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="m6.41 6.41 2.83 2.83"/><path d="M2 12h4"/><path d="m6.41 17.59 2.83-2.83"/><path d="M12 18v4"/><path d="m17.59 17.59-2.83-2.83"/><path d="M18 12h4"/><path d="m17.59 6.41-2.83 2.83"/><circle cx="12" cy="12" r="3"/></svg>'
  };

  // ====== HELPERS ======
  function initials(name) {
    return name.split(' ').filter(Boolean).slice(0, 2).map(s => s[0]).join('').toUpperCase();
  }

  function el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') {
        Object.assign(node.style, v);
      }
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) node.setAttribute(k, v);
    }
    for (const c of [].concat(children)) {
      if (c == null) continue;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return node;
  }

  // ====== RENDER ======
  function renderNav() {
    const wrap = document.getElementById('navLinks');
    wrap.innerHTML = '';
    NAV.forEach(n => {
      const a = el('a', { href: '#' + n.id, class: 'nav-link', 'data-nav': n.id }, n.label);
      wrap.appendChild(a);
    });
  }

  function renderHero() {
    const p = PASSPORT;
    return el('section', { id: 'hero', class: 'hero' }, [
      el('div', { class: 'container' }, [
        el('div', { class: 'hero-eyebrow' }, [
          el('span', { class: 'dot' }),
          el('span', {}, 'Творческая проектировочная группа · 2026/2027')
        ]),
        el('h1', {}, [
          'ТПГ ',
          el('span', { class: 'accent' }, '«ГенИИ»')
        ]),
        el('p', { class: 'hero-sub' }, p.fullName),
        el('div', { class: 'passport-grid' }, [
          passportCard('Заказчик', p.customer),
          passportCard('Куратор', p.curator),
          passportCard('Название', p.name),
          passportCard('Глобальная цель', p.goal)
        ])
      ])
    ]);
  }

  function passportCard(label, value) {
    return el('div', { class: 'passport-card' }, [
      el('div', { class: 'passport-label' }, label),
      el('div', { class: 'passport-value' }, value)
    ]);
  }

  function sectionHead(num, title, lead) {
    return el('div', { class: 'section-head' }, [
      el('div', { class: 'section-num' }, num),
      el('h2', { class: 'section-title' }, title),
      lead ? el('p', { class: 'section-lead' }, lead) : null
    ]);
  }

  function renderStage1() {
    const acc = el('div', { class: 'accordion' });
    STAGE1.items.forEach((item, i) => {
      const row = el('div', { class: 'acc-item', 'data-acc': i });
      const trigger = el('button', {
        class: 'acc-trigger',
        type: 'button',
        'aria-expanded': i === 0 ? 'true' : 'false'
      }, [
        el('span', { class: 'acc-icon', html: ICONS[item.icon] }),
        el('span', { class: 'acc-title' }, item.title),
        el('span', { class: 'acc-chevron', html: ICONS.chevron })
      ]);
      const content = el('div', { class: 'acc-content' }, [
        el('div', { class: 'acc-body', html: item.body })
      ]);
      row.appendChild(trigger);
      row.appendChild(content);
      acc.appendChild(row);
    });

    return el('section', { id: 'stage1' }, [
      el('div', { class: 'container' }, [
        sectionHead('Этап 01', 'Выявление и анализ проблемы', STAGE1.problem),
        acc
      ])
    ]);
  }

  function renderStage2() {
    const f = STAGE2.formula;
    const formula = el('div', { class: 'formula' }, [
      el('div', { class: 'formula-label' }, 'Формула темы'),
      el('div', { class: 'formula-text', html:
        `«<span class="hl">${f.what}</span>» через «<span class="hl">${f.how}</span>» в условиях «<span class="hl">${f.where}</span>».`
      })
    ]);

    const criteria = el('div', { class: 'criteria-list' });
    STAGE2.criteria.forEach(c => {
      criteria.appendChild(el('div', { class: 'criteria-row' }, [
        el('span', { class: 'check', html: ICONS.check }),
        el('div', {}, [
          el('div', { class: 'label' }, c.label),
          el('div', { class: 'desc' }, c.desc)
        ])
      ]));
    });

    // Personalization block
    const p = STAGE2.personalization;
    const goalsList = el('ul');
    p.goals.forEach(g => goalsList.appendChild(el('li', {}, g)));

    const personalization = el('div', { class: 'personalization' }, [
      el('div', { class: 'personalization-header' }, [
        el('div', { class: 'personalization-icon', html: ICONS.personalize }),
        el('div', {}, [
          el('div', { class: 'personalization-title' }, p.title),
          el('div', { class: 'personalization-sub' }, p.subtitle)
        ])
      ]),
      el('div', { class: 'personalization-def' }, p.definition),
      el('div', { class: 'personalization-goals' }, [
        el('div', { class: 'personalization-goals-title' }, 'Цели направления'),
        goalsList
      ])
    ]);

    return el('section', { id: 'stage2' }, [
      el('div', { class: 'container' }, [
        sectionHead('Этап 02', 'Формулирование темы', 'Перевод проблемы в конкретную тему с проверкой по пяти критериям.'),
        el('div', { class: 'card' }, [
          el('div', { class: 'passport-label' }, 'Тема ТПГ'),
          el('div', { style: 'font-size:17px;font-weight:500;line-height:1.5;color:var(--fg)' }, STAGE2.theme)
        ]),
        formula,
        el('h3', { style: 'font-size:18px;font-weight:600;margin:28px 0 4px;letter-spacing:-0.01em' }, 'Проверка по критериям'),
        criteria,
        personalization
      ])
    ]);
  }

  function renderStage3() {
    const grid = el('div', { class: 'grid-3' });
    STAGE3.forEach(item => {
      grid.appendChild(el('div', { class: 'card' }, [
        el('div', { class: 'acc-icon', style: 'margin-bottom:14px', html: ICONS[item.icon] }),
        el('h3', { style: 'font-size:16px;font-weight:600;margin:0 0 8px;letter-spacing:-0.01em' }, item.title),
        el('p', { style: 'margin:0;color:var(--fg-2);font-size:14.5px;line-height:1.55' }, item.text)
      ]));
    });
    return el('section', { id: 'stage3' }, [
      el('div', { class: 'container' }, [
        sectionHead('Этап 03', 'Обоснование актуальности', 'Три основания, на которых держится тема: наука, практика и внутренняя готовность.'),
        grid
      ])
    ]);
  }

  function renderStage4() {
    const metrics = el('div', { class: 'metrics' });
    STAGE4.metrics.forEach(m => {
      metrics.appendChild(el('div', { class: 'metric' }, [
        el('div', { class: 'metric-label' }, m.label),
        el('div', {}, [
          el('span', { class: 'metric-value' }, m.value),
          el('span', { class: 'metric-unit' }, m.unit)
        ]),
        el('div', { class: 'metric-hint' }, m.hint)
      ]));
    });

    const tasks = el('div', { class: 'card' });
    tasks.appendChild(el('div', { class: 'passport-label' }, 'Задачи'));
    const ul = el('ul', { style: 'margin:10px 0 0;padding-left:18px' });
    STAGE4.tasks.forEach(t => ul.appendChild(el('li', { style: 'margin-bottom:8px;color:var(--fg-2)' }, t)));
    tasks.appendChild(ul);

    const products = el('div', { class: 'card' });
    products.appendChild(el('div', { class: 'passport-label' }, 'Планируемый продукт'));
    const ul2 = el('ul', { style: 'margin:10px 0 0;padding-left:18px' });
    STAGE4.products.forEach(t => ul2.appendChild(el('li', { style: 'margin-bottom:8px;color:var(--fg-2)' }, t)));
    products.appendChild(ul2);

    return el('section', { id: 'stage4' }, [
      el('div', { class: 'container' }, [
        sectionHead('Этап 04', 'Цели, задачи и ожидаемые результаты', STAGE4.goal),
        metrics,
        el('div', { class: 'grid-2', style: 'margin-top:20px' }, [tasks, products])
      ])
    ]);
  }

  function renderStage5() {
    const teamGrid = el('div', { class: 'team-grid' });
    TEAM.forEach(m => {
      teamGrid.appendChild(el('div', { class: 'member' }, [
        el('div', { class: 'avatar', style: 'background:' + m.color }, initials(m.name)),
        el('div', { class: 'member-info' }, [
          el('div', { class: 'member-name' }, m.name),
          el('div', { class: 'member-role' }, m.role)
        ])
      ]));
    });

    const tl = el('div', { class: 'timeline' });
    TIMELINE.forEach(t => {
      tl.appendChild(el('div', { class: 'tl-item' }, [
        el('div', { class: 'tl-period' }, t.period),
        el('div', { class: 'tl-title' }, t.title)
      ]));
    });

    const risks = el('div', { class: 'grid-2' });
    RISKS.forEach((r, i) => {
      const card = el('div', {
        class: 'risk-card',
        'data-risk': i,
        role: 'button',
        tabindex: '0',
        'aria-expanded': 'false'
      }, [
        el('div', { class: 'risk-head' }, [
          el('span', { class: 'risk-icon', html: ICONS.warn }),
          el('div', { style: 'flex:1' }, [
            el('div', { class: 'risk-title' }, r.title),
            el('div', { class: 'risk-hint' }, 'Нажмите, чтобы увидеть минимизацию')
          ])
        ]),
        el('div', { class: 'risk-mitigation', html: '<strong>Минимизация: </strong>' + r.mitigation })
      ]);
      risks.appendChild(card);
    });

    return el('section', { id: 'stage5' }, [
      el('div', { class: 'container' }, [
        sectionHead('Этап 05', 'Ресурсное обоснование', 'Кадры, время, инфраструктура и управление рисками.'),

        el('h3', { style: 'font-size:17px;font-weight:600;margin:0 0 14px;letter-spacing:-0.01em' }, 'Состав ТПГ'),
        el('div', { class: 'card', style: 'padding:18px' }, [teamGrid]),

        el('h3', { style: 'font-size:17px;font-weight:600;margin:32px 0 4px;letter-spacing:-0.01em' }, 'График работы · 1 учебный год'),
        el('p', { style: 'color:var(--muted);margin:0 0 8px;font-size:14.5px' }, 'Ресурсы: компьютерная инфраструктура школы, доступ к нейросетям (Qwen, DeepSeek и др.) и платформе для размещения сайтов (GitHub, GitVerse).'),
        tl,

        el('h3', { style: 'font-size:17px;font-weight:600;margin:32px 0 4px;letter-spacing:-0.01em' }, 'Риски и минимизация'),
        risks
      ])
    ]);
  }

  function renderStage6() {
    const grid = el('div', { class: 'grid-2' });
    THESIS.forEach((t, i) => {
      grid.appendChild(el('div', { class: 'thesis-card' }, [
        el('div', { class: 'thesis-num' }, 'Тезис ' + String(i + 1).padStart(2, '0')),
        el('p', { class: 'thesis-q' }, t.q),
        el('p', { class: 'thesis-a' }, t.a)
      ]));
    });
    return el('section', { id: 'stage6' }, [
      el('div', { class: 'container' }, [
        sectionHead('Этап 06', 'Тезисы', '6 ключевых ответов.'),
        grid
      ])
    ]);
  }

  function renderStage7() {
    const grid = el('div', { class: 'role-grid' });
    ROLES.forEach(role => {
      const itemsList = el('ul', { class: 'role-list' });
      role.items.forEach(item => {
        itemsList.appendChild(el('li', {}, item));
      });

      grid.appendChild(el('div', { class: 'role-card' }, [
        el('div', { class: 'role-head' }, [
          el('div', { class: 'role-icon', html: ICONS[role.icon] || ICONS.user }),
          el('div', {}, [
            el('div', { class: 'role-title' }, role.title),
            el('div', { class: 'role-subtitle' }, role.subtitle)
          ])
        ]),
        itemsList
      ]));
    });

    return el('section', { id: 'stage7' }, [
      el('div', { class: 'container' }, [
        sectionHead('Этап 07', 'Применение ИИ по сферам', 'Как сотрудники разных МО и служб комплекса смогут использовать ИИ в своей ежедневной работе. ТПГ работает не только для разработки уроков — каждая сфера находит свои точки роста.'),
        grid
      ])
    ]);
  }

  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(renderHero());
    app.appendChild(renderStage1());
    app.appendChild(renderStage2());
    app.appendChild(renderStage3());
    app.appendChild(renderStage4());
    app.appendChild(renderStage5());
    app.appendChild(renderStage6());
    app.appendChild(renderStage7());

    applyRoleStyles();
  }

  function applyRoleStyles() {
    const cards = document.querySelectorAll('.role-card');
    cards.forEach((card, i) => {
      if (ROLES[i]) {
        card.style.setProperty('--role-color', ROLES[i].color);
        card.style.setProperty('--role-soft', ROLES[i].soft);
      }
    });
  }

  // ====== HANDLERS ======
  function setupAccordion() {
    const firstItem = document.querySelector('.acc-item[data-acc="0"]');
    if (firstItem) firstItem.classList.add('open');

    document.querySelectorAll('.acc-trigger').forEach(trigger => {
      trigger.addEventListener('click', (e) => {
        e.preventDefault();
        const item = trigger.closest('.acc-item');
        const isOpen = item.classList.contains('open');

        document.querySelectorAll('.acc-item').forEach(it => {
          it.classList.remove('open');
          const btn = it.querySelector('.acc-trigger');
          if (btn) btn.setAttribute('aria-expanded', 'false');
        });

        if (!isOpen) {
          item.classList.add('open');
          trigger.setAttribute('aria-expanded', 'true');
        }
      });
    });
  }

  function setupRisks() {
    document.querySelectorAll('.risk-card').forEach(card => {
      const toggle = () => {
        const isOpen = card.classList.contains('open');
        if (isOpen) {
          card.classList.remove('open');
          card.setAttribute('aria-expanded', 'false');
        } else {
          card.classList.add('open');
          card.setAttribute('aria-expanded', 'true');
        }
      };
      card.addEventListener('click', toggle);
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle();
        }
      });
    });
  }

  function setupScrollSpy() {
    const sections = NAV.map(n => document.getElementById(n.id)).filter(Boolean);
    const links = document.querySelectorAll('.nav-link');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const id = e.target.id;
          links.forEach(l => l.classList.toggle('active', l.getAttribute('data-nav') === id));
        }
      });
    }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
    sections.forEach(s => io.observe(s));
  }

  function setupProgress() {
    const bar = document.getElementById('progressBar');
    const onScroll = () => {
      const h = document.documentElement;
      const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight);
      bar.style.width = Math.min(100, Math.max(0, scrolled * 100)) + '%';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // ====== INIT ======
  function init() {
    renderNav();
    render();
    setupAccordion();
    setupRisks();
    setupScrollSpy();
    setupProgress();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
